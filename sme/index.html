var LSKEY = "sme-map-key-v1";

function b2a(b){var u=new Uint8Array(b),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function a2b(a){var s=atob(a),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}

async function deriveKey(pass, salt){
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:salt, iterations:310000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function decryptWith(key){
  var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:a2b(PAYLOAD.iv)}, key, a2b(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
function show(html){
  document.open(); document.write(html); document.close();
}
async function unlock(pass, remember){
  var key = await deriveKey(pass, a2b(PAYLOAD.salt));
  var html = await decryptWith(key);           // 失敗するとここで例外
  if (remember){
    try{
      var raw = await crypto.subtle.exportKey("raw", key);
      localStorage.setItem(LSKEY, b2a(raw));
    }catch(e){}
  }
  show(html);
}
(async function(){
  // 2回目以降は保存した鍵で素通り
  try{
    var saved = localStorage.getItem(LSKEY);
    if (saved){
      var key = await crypto.subtle.importKey("raw", a2b(saved), {name:"AES-GCM"}, true, ["decrypt"]);
      show(await decryptWith(key));
      return;
    }
  }catch(e){ try{ localStorage.removeItem(LSKEY); }catch(e2){} }

  var pw = document.getElementById("pw"), go = document.getElementById("go"), err = document.getElementById("err");
  async function submit(){
    err.textContent = "";
    go.disabled = true; go.textContent = "復号中…";
    try{ await unlock(pw.value, true); }
    catch(e){
      err.textContent = "パスフレーズが違います";
      go.disabled = false; go.textContent = "開く";
      pw.select();
    }
  }
  go.addEventListener("click", submit);
  pw.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
  pw.focus();
})();
</script>
